name: Build Wplay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar Wplay
        run: python3 -c "import zipfile; zipfile.ZipFile('Wplay_2_0_v3_Mobile_Build.zip').extractall('build_wplay')"

      - name: Ativar AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' >> build_wplay/Wplay_2_0/gradle.properties
      - name: Ajustar Java e Kotlin para 17
        run: |
          python3 -c "p='build_wplay/Wplay_2_0/app/build.gradle'; s=open(p).read(); s=s.replace('JavaVersion.VERSION_1_8','JavaVersion.VERSION_17').replace('jvmTarget = \"1.8\"','jvmTarget = \"17\"').replace(\"jvmTarget = '1.8'\", \"jvmTarget = '17'\"); open(p,'w').write(s)"

      - name: Compilar APK
        run: |
          cd build_wplay/Wplay_2_0
          gradle assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wplay-APK
          path: build_wplay/Wplay_2_0/app/build/outputs/apk/debug/app-debug.apk
